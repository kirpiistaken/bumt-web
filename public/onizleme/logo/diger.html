<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Diğer logo kullanımları</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e9e4d8;font-family:Inter,sans-serif;color:#141414;padding:30px;display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start}

</style></head><body>
